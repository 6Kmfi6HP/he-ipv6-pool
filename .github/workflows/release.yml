# 测试、交叉编译并发布到 GitHub Release，同时推送多架构 Docker 镜像到 ghcr.io。两种发版方式：
#   1. 推送标签：git tag v0.1.0 && git push origin v0.1.0
#   2. 手动触发：Actions 页面选 release → Run workflow → 填版本号；或者 gh workflow run release.yml -f version=v0.1.0
#      会在所选分支的最新提交上创建标签
# 版本号格式 vX.Y.Z，带后缀（如 v0.2.0-rc1）的发布为预发布版本。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v0.1.0"
        required: true

permissions:
  contents: write

env:
  # 通过环境变量传给脚本，不直接拼进 run，避免输入里的特殊字符被当成命令执行
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check version
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::版本号格式应为 vX.Y.Z 或 vX.Y.Z-rc1，得到 $TAG"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::标签 $TAG 已存在"; exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          # 用 1.25 系列最新补丁版编译，带上标准库的安全修复；go.mod 里的 1.25.5 只是最低版本。
          # gVisor 依赖运行时内部实现，升级 Go 大版本前要先升级 gVisor
          go-version: "1.25"
          check-latest: true
      - run: go vet ./... && go test -race -count=1 ./...
      - name: build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "dist/he-ipv6-pool-${target%/*}-${target#*/}" .
          done
          cd dist && sha256sum -- * > SHA256SUMS
      - name: release
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}

  # 镜像发布放在同一个工作流里：手动触发时标签由 GITHUB_TOKEN 创建，不会再触发别的工作流；
  # needs 保证测试通过、版本号校验通过后才推送
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # v1.2.3 → 1.2.3、1.2；正式版额外打 latest，预发布版只打完整版本号
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
